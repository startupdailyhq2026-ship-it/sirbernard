<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QVAC Local AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 700px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .header {
      background: #111;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #ccc;
    }

    .chat {
      padding: 25px;
      min-height: 300px;
      max-height: 450px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      color: #777;
      margin-top: 60px;
    }

    .message {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #eeeeee;
      margin-left: 15%;
    }

    .ai {
      background: #111;
      color: white;
      margin-right: 15%;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 20px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #777;
      padding-bottom: 15px;
    }

    @media (max-width: 600px) {
      .input-area {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .user,
      .ai {
        margin-left: 0;
        margin-right: 0;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>QVAC Local AI</h1>
    <p>Private AI running directly on your device</p>
  </div>

  <div class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h2>👋 Welcome!</h2>
      <p>Ask me anything.</p>
    </div>

  </div>

  <div class="status" id="status">
    🟢 Local AI • Powered by Tether's QVAC SDK
  </div>

  <div class="input-area">

    <input
      id="question"
      type="text"
      placeholder="Ask something..."
      autocomplete="off"
    >

    <button id="askButton">
      ASK
    </button>

  </div>

</div>

<script>

const button = document.getElementById("askButton");
const question = document.getElementById("question");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const status = document.getElementById("status");

async function askQVAC() {

  const text = question.value.trim();

  if (!text) {
    return;
  }

  welcome.style.display = "none";

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.innerText = text;
  chat.appendChild(userMessage);

  question.value = "";
  button.disabled = true;
  status.innerText = "🟡 QVAC is thinking...";

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.innerText = "Thinking...";
  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch("http://localhost:3000/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: text
      })
    });

    const data = await response.json();

    aiMessage.innerText = data.answer || "No answer received.";

    status.innerText = "🟢 QVAC is ready";

  } catch (error) {

    aiMessage.innerText = "Error: " + error.message;
    status.innerText = "🔴 Connection error";

  }

  button.disabled = false;
  question.focus();

  chat.scrollTop = chat.scrollHeight;
}

button.addEventListener("click", askQVAC);

question.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    askQVAC();
  }
});

</script>

</body>
</html>
